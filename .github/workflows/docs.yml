name: Docs

# Documentation is built here and published to GitHub Pages, never shipped in
# the production image — nothing under etdagen.no serves the API reference, so
# ordinary visitors cannot wander into it.
#
#   merge to prod  ->  docs.etdagen.no/          (stable)
#   merge to dev   ->  docs.etdagen.no/next/     (unreleased, plus a changelog)
#   pull request   ->  spec built + endpoint changelog posted as a comment
#
# The build needs no repository secrets. The prerender that emits the spec
# makes zero Firebase calls, so scripts/build-docs.ts generates a throwaway
# key when no credentials are present.

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned deliberately: a floating tag here would let an upstream release
  # change the changelog output without a commit in this repo.
  OASDIFF_IMAGE: tufin/oasdiff:v1.29.1

jobs:
  # ---------------------------------------------------------------------------
  # Pull requests: build the spec, diff it against the target branch, comment.
  # Publishes nothing — Pages hosts a single site and has no per-PR previews.
  # ---------------------------------------------------------------------------
  changelog:
    name: api changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version-file: head/.nvmrc

      # Built separately rather than via ./.github/actions/setup, because each
      # ref needs its own dependency install inside its own checkout.
      #
      # The base branch has no docs:build until this pipeline is merged into
      # it, so its spec is best-effort: without a baseline there is nothing to
      # diff against, and the comment says so instead of failing the check.
      # Once dev and prod both carry the pipeline this guard is dead weight.
      - name: Build both specs
        run: |
          for dir in base head; do
            if [ ! -f "$dir/scripts/build-docs.ts" ]; then
              echo "::notice::$dir has no docs pipeline yet - skipping its spec"
              continue
            fi
            (cd "$dir" && bun install --frozen-lockfile && bun run docs:build)
          done

      - name: Diff the two specs
        id: diff
        run: |
          if [ ! -f base/docs-dist/api/openapi.json ]; then
            echo 'No baseline: the target branch does not generate a spec yet,' \
                 'so there is nothing to compare against.' > changelog.md
          elif [ ! -f head/docs-dist/api/openapi.json ]; then
            echo 'This branch does not generate a spec.' > changelog.md
          else
            docker run --rm -v "$PWD:/w" -w /w "$OASDIFF_IMAGE" \
              changelog /w/base/docs-dist/api/openapi.json \
                        /w/head/docs-dist/api/openapi.json \
              --format markdown > changelog.md || echo "" > changelog.md
          fi

          if [ ! -s changelog.md ]; then
            echo 'No changes to the API surface.' > changelog.md
          fi

      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body =
              '<!-- api-changelog -->\n## API changes\n\n' +
              fs.readFileSync('changelog.md', 'utf8')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number,
            })
            // Update in place so a busy PR does not accumulate one comment per push.
            const existing = comments.data.find((c) =>
              c.body.startsWith('<!-- api-changelog -->'),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              })
            }

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: head/docs-dist/api/openapi.*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Merges: rebuild the whole site from both refs and publish it.
  #
  # deploy-pages replaces the entire site on every run, so a dev-only build
  # would wipe the stable docs at the root. Both refs are therefore built on
  # every run; the site can never end up half-stale.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: prod
          ref: prod

      - uses: actions/checkout@v4
        with:
          path: dev
          ref: dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.nvmrc

      # Until this pipeline reaches prod, that branch has no docs:build script.
      # Publish the dev docs alone rather than failing the whole run; the guard
      # becomes dead weight after the first dev -> prod merge and can be dropped.
      - name: Build stable docs
        working-directory: prod
        env:
          DOCS_OUT: ${{ github.workspace }}/site
          DOCS_SERVER: https://etdagen.no
          # ── Custom domain switch ────────────────────────────────────
          # 'false' publishes to https://et-dagen.github.io/et-dagen/.
          # 'true'  publishes docs/CNAME, moving the site to the hostname
          #         named in that file (currently docs.etdagen.no).
          #
          # Order matters. Setting this to 'true' before the DNS record
          # resolves takes the docs OFFLINE: GitHub adopts the custom domain
          # and starts redirecting the github.io URL to a host that does not
          # answer, so BOTH addresses break until DNS catches up.
          #
          # To switch over, in this order:
          #   1. Have the DNS admin add:  docs CNAME et-dagen.github.io
          #   2. Confirm it resolves:     dig +short docs.etdagen.no
          #   3. Flip this to 'true' and merge
          #   4. Repo Settings > Pages picks the domain up from the artifact;
          #      tick "Enforce HTTPS" once the certificate is issued
          #
          # To move to etdagene.no later, edit docs/CNAME - one file, one line.
          # Nothing here needs to change.
          DOCS_DOMAIN: 'true'
        run: |
          if [ ! -f scripts/build-docs.ts ]; then
            echo "::warning::prod has no docs pipeline yet - publishing /next/ only"
            mkdir -p "$DOCS_OUT"
            if [ "$DOCS_DOMAIN" = 'true' ]; then
              cp ../dev/docs/CNAME "$DOCS_OUT/CNAME"
            fi
            touch "$DOCS_OUT/.nojekyll"
            echo '<meta http-equiv="refresh" content="0; url=./next/">' \
              > "$DOCS_OUT/index.html"
            exit 0
          fi
          bun install --frozen-lockfile
          DOCS_VERSION="prod-$(git rev-parse --short HEAD)" bun run docs:build

      - name: Build unreleased docs
        working-directory: dev
        env:
          DOCS_OUT: ${{ github.workspace }}/site/next
          DOCS_SERVER: https://etdagen.no
          DOCS_LABEL: dev
        run: |
          bun install --frozen-lockfile
          DOCS_VERSION="dev-$(git rev-parse --short HEAD)" bun run docs:build

      # /next/ leads with the delta rather than a second copy of the docs, so
      # a reader is not made to diff two full references by eye.
      - name: Generate the unreleased changelog
        run: |
          if [ -f site/api/openapi.json ]; then
            docker run --rm -v "$PWD:/w" -w /w "$OASDIFF_IMAGE" \
              changelog /w/site/api/openapi.json \
                        /w/site/next/api/openapi.json \
              --format html > changelog.html || true
          fi

          # A changelog failure must not take the site down with it; the full
          # reference under /next/api/ stays reachable either way.
          if [ ! -s changelog.html ]; then
            echo '<p>No API changes, or changelog unavailable for this build.</p>' \
              > changelog.html
          fi

          bun run dev/scripts/render-next.ts \
            dev/docs/next.html changelog.html site/next/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
