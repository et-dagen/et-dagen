name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]
  workflow_dispatch:

# Superseded runs on the same ref are pointless once a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The four jobs below are the required status checks. They are declared
  # separately rather than as a matrix so their names stay stable — branch
  # ruleset contexts match on job name, and matrix names ("check (lint)") are
  # easy to break by editing the matrix.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run build

  # --- Advisory jobs: reported, never merge-blocking -----------------------

  # Vue SFCs carry pre-existing type errors that predate any typechecking in
  # this repo. This surfaces them on every PR without blocking. As they are
  # fixed, fold the SFC surface into `bun run typecheck` and drop this job.
  typecheck-sfc:
    name: typecheck (vue, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run typecheck:full

  # Squash merges take their commit subject from the PR title, so an
  # unconventional title lands an unconventional commit on dev.
  pr-title:
    name: pr title (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx --bun commitlint
