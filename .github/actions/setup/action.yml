name: Setup
description: Install the bun + node toolchain and project dependencies.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Kept in step with the `packageManager` field in package.json.
        bun-version: 1.3.14

    # Nuxt's build and some of its dependencies shell out to node, so it has to
    # be present even though bun drives the scripts.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
