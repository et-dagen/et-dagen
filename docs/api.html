<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E&amp;T-dagene API reference</title>
    <style>
      body {
        margin: 0;
      }
      .banner {
        font:
          14px/1.5 system-ui,
          sans-serif;
        background: #fff4e5;
        color: #7a4a12;
        padding: 10px 16px;
        border-bottom: 1px solid #f0d6ae;
      }
      .banner a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    {{BANNER}}
    <div id="app"></div>
    <!-- Bundle is vendored at build time from @scalar/api-reference; no CDN. -->
    <script src="./scalar/standalone.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        // One document per API version, generated by scripts/build-docs.ts
        // from the paths in the spec. A new /api/vN/ appears here on its own.
        sources: {{SOURCES}},
        // Downloads are served as static files beside this page.
        documentDownloadType: 'direct',
        // ofetch is what Nuxt's $fetch wraps, so the default snippet matches
        // how these endpoints are actually called from the app. Swap to
        // { targetKey: 'node', clientKey: 'undici' } for plain server-side
        // Node, or 'shell'/'curl' for copy-pasteable terminal examples.
        defaultHttpClient: { targetKey: 'js', clientKey: 'ofetch' },
      })
    </script>
  </body>
</html>
